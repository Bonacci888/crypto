name: live-data

on:
  schedule:
    - cron: '23 * * * *'        # stuendlich, Minute 23
    - cron: '57 23 * * *'       # taeglich 23:57 -> Archiv-Kopie
    - cron: '30 3 1 * *'        # monatlich, 1. um 03:30 -> Cleanup
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- STUENDLICH: live-data.txt wird UEBERSCHRIEBEN ----------
  fetch:
    if: github.event.schedule != '30 3 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Daten abrufen
        run: python3 crypto_check.py AERO XRP BTC > live-data.txt
      - name: Ergebnis ins Repo committen
        run: |
          git config user.name "live-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add live-data.txt
          git commit -m "live data $(date -u +%Y-%m-%d_%H:%M_UTC)" || exit 0
          git push

  # ---------- TAEGLICH: Archiv-Kopie pro Tag (Historie fuer Backtests) ----------
  archive:
    if: github.event.schedule == '57 23 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tageskopie anlegen
        run: |
          mkdir -p archiv
          cp live-data.txt "archiv/$(date -u +%Y-%m-%d).txt"
          git config user.name "live-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add archiv/
          git commit -m "archiv $(date -u +%Y-%m-%d)" || exit 0
          git push

  # ---------- MONATLICH: History squashen (Repo bleibt winzig) ----------
  cleanup:
    if: github.event.schedule == '30 3 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: History auf einen Commit zusammenfassen
        run: |
          git config user.name "live-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan tmp-main
          git add -A
          git commit -m "squash: $(date -u +%Y-%m)"
          git branch -M main
          git push -f origin main
